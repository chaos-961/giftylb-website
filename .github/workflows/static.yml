name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The allowlist. Nothing reaches production unless it is copied here.
      # A new runtime file that is missing from this list exists in the repo and
      # 404s on the live site. tools/check-release.mjs fails the release if any
      # file referenced by an HTML page is not listed below.
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/css _site/js _site/js/engine _site/fonts _site/admin
          mkdir -p _site/assets/products/mug _site/assets/products/cap
          mkdir -p _site/assets/products/bottle _site/assets/products/tote _site/assets/products/photo-block

          cp index.html _site/index.html
          cp 404.html _site/404.html
          cp customize.html _site/customize.html
          cp shop.html _site/shop.html
          cp cart.html _site/cart.html
          cp checkout.html _site/checkout.html
          cp track.html _site/track.html
          cp admin/index.html _site/admin/index.html
          cp admin/payload.js _site/admin/payload.js
          cp .nojekyll _site/.nojekyll

          # CNAME is deliberately NOT copied yet. giftylb.com has no DNS records,
          # and shipping the file would set a custom domain that does not resolve,
          # which makes Pages redirect the github.io URL to it and the site
          # becomes unreachable. Restore this line the same day the domain is
          # registered and pointed at Pages:
          #   cp CNAME _site/CNAME

          cp css/tokens.css _site/css/tokens.css
          cp css/base.css _site/css/base.css
          cp css/chrome.css _site/css/chrome.css
          cp css/home.css _site/css/home.css
          cp css/shop.css _site/css/shop.css
          cp css/checkout.css _site/css/checkout.css
          cp css/customize.css _site/css/customize.css

          cp js/firebase-config.js _site/js/firebase-config.js
          cp js/main.js _site/js/main.js
          cp js/data.js _site/js/data.js
          cp js/recipe.js _site/js/recipe.js
          cp js/proof.js _site/js/proof.js
          cp js/customize.js _site/js/customize.js
          cp js/delivery.js _site/js/delivery.js
          cp js/cart.js _site/js/cart.js
          cp js/cart-page.js _site/js/cart-page.js
          cp js/shop.js _site/js/shop.js
          cp js/checkout.js _site/js/checkout.js
          cp js/track.js _site/js/track.js
          cp js/engine/warp.js _site/js/engine/warp.js
          cp js/engine/design.js _site/js/engine/design.js
          cp js/engine/render.js _site/js/engine/render.js
          cp js/engine/state.js _site/js/engine/state.js
          cp js/engine/photo.js _site/js/engine/photo.js
          cp js/engine/price.js _site/js/engine/price.js

          # data/ is NOT copied. Since P4 the catalogue lives in the database and
          # the shop reads it from there, so these files are the seed that
          # tools/seed-firestore.mjs pushes once. Shipping them would publish a
          # second, slowly rotting answer to what a mug costs.

          cp assets/products/mug/base.svg _site/assets/products/mug/base.svg
          cp assets/products/mug/mask-body.svg _site/assets/products/mug/mask-body.svg
          cp assets/products/mug/gloss.svg _site/assets/products/mug/gloss.svg

          cp assets/products/cap/base.svg _site/assets/products/cap/base.svg
          cp assets/products/cap/mask-crown.svg _site/assets/products/cap/mask-crown.svg
          cp assets/products/cap/mask-panels.svg _site/assets/products/cap/mask-panels.svg
          cp assets/products/cap/mask-brim.svg _site/assets/products/cap/mask-brim.svg
          cp assets/products/cap/mask-button.svg _site/assets/products/cap/mask-button.svg

          cp assets/products/bottle/base.svg _site/assets/products/bottle/base.svg
          cp assets/products/bottle/mask-body.svg _site/assets/products/bottle/mask-body.svg
          cp assets/products/bottle/mask-lid.svg _site/assets/products/bottle/mask-lid.svg
          cp assets/products/bottle/mask-band.svg _site/assets/products/bottle/mask-band.svg

          cp assets/products/tote/base.svg _site/assets/products/tote/base.svg
          cp assets/products/tote/mask-body.svg _site/assets/products/tote/mask-body.svg

          cp assets/products/photo-block/base.svg _site/assets/products/photo-block/base.svg
          cp assets/products/photo-block/mask-base.svg _site/assets/products/photo-block/mask-base.svg

          cp fonts/bricolage-grotesque-var-latin.woff2 _site/fonts/bricolage-grotesque-var-latin.woff2
          cp fonts/inter-var-latin.woff2 _site/fonts/inter-var-latin.woff2
          cp fonts/caveat-var-latin.woff2 _site/fonts/caveat-var-latin.woff2

      - name: Show what is shipping
        run: find _site -type f | sort

      # enablement only works once the Pages site already exists. Creating it
      # with the default GITHUB_TOKEN fails with "Resource not accessible by
      # integration", which is exactly how the first run of this workflow died.
      # Pages was created once, out of band, with an account that has admin:
      #   gh api -X POST repos/chaos-961/giftylb-website/pages -f build_type=workflow
      # The flag stays because it is harmless now and covers a repo recreation.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
