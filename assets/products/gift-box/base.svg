<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
<!-- Gift box with a lid, a ribbon and a card leaning on the front. Grayscale,
     so every tint stays photographic. The card face is the print surface: the
     message is written on it in the handwriting face and nowhere else. -->
<defs>
  <linearGradient id="bx" x1="0" y1="330" x2="0" y2="540" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#f2f2f2"/><stop offset="0.55" stop-color="#d8d8d8"/>
    <stop offset="1" stop-color="#a9a9a9"/>
  </linearGradient>
  <linearGradient id="lid" x1="0" y1="276" x2="0" y2="346" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fbfbfb"/><stop offset="0.6" stop-color="#e2e2e2"/>
    <stop offset="1" stop-color="#bdbdbd"/>
  </linearGradient>
  <linearGradient id="rib" x1="418" y1="0" x2="482" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#c9c9c9"/><stop offset="0.42" stop-color="#f4f4f4"/>
    <stop offset="1" stop-color="#b4b4b4"/>
  </linearGradient>
  <linearGradient id="crd" x1="461" y1="380" x2="729" y2="560" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e6e6"/>
  </linearGradient>
  <radialGradient id="dropB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#000" stop-opacity="0.24"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
</defs>

<ellipse cx="450" cy="586" rx="290" ry="28" fill="url(#dropB)"/>

<!-- body -->
<rect x="210" y="330" width="480" height="212" rx="12" fill="url(#bx)"/>
<path d="M210 330 h480 v18 h-480 z" fill="#000" opacity="0.06"/>

<!-- ribbon down the body -->
<rect x="418" y="330" width="64" height="212" fill="url(#rib)"/>

<!-- lid -->
<rect x="190" y="276" width="520" height="70" rx="10" fill="url(#lid)"/>
<rect x="190" y="276" width="520" height="12" rx="6" fill="#fff" opacity="0.5"/>
<path d="M190 336 h520 v10 a10 10 0 0 1 -10 10 h-500 a10 10 0 0 1 -10 -10 z" fill="#000" opacity="0.07"/>

<!-- ribbon over the lid, and the bow -->
<rect x="418" y="276" width="64" height="70" fill="url(#rib)"/>
<path d="M450 276 c-52 -6 -86 -26 -86 -50 c0 -16 16 -26 34 -20 c22 8 40 34 52 70 z" fill="url(#rib)"/>
<path d="M450 276 c52 -6 86 -26 86 -50 c0 -16 -16 -26 -34 -20 c-22 8 -40 34 -52 70 z" fill="url(#rib)"/>
<circle cx="450" cy="262" r="17" fill="#e4e4e4"/>
<circle cx="450" cy="262" r="17" fill="none" stroke="#b9b9b9" stroke-width="2"/>

<!-- the card, leaning -->
<g transform="rotate(-6 595 470)">
  <rect x="470" y="380" width="250" height="180" rx="6" fill="#000" opacity="0.12" transform="translate(6 8)"/>
  <rect x="470" y="380" width="250" height="180" rx="6" fill="url(#crd)"/>
  <rect x="470" y="380" width="250" height="180" rx="6" fill="none" stroke="#d2d2d2" stroke-width="2"/>
</g>
</svg>
