<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
<!-- Colour part mask for the mug body and handle. White where the colour goes,
     transparent everywhere else. The renderer fills this shape with the chosen
     hex and composites it onto the grayscale base with mix multiply, so the
     rim shadow and the specular in base.svg both survive the tint. -->
