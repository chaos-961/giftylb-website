      fill="none" stroke="#fff" stroke-width="54" stroke-linecap="round"/>
<path d="M200 140 L200 553 A220 34 0 0 0 640 553 L640 140 Z" fill="#fff"/>
<ellipse cx="420" cy="140" rx="220" ry="36" fill="#fff"/>
<ellipse cx="420" cy="143" rx="203" ry="30" fill="#000" fill-opacity="0"/>
</svg>
