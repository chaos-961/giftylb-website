<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
<!-- Mug, front view, GRAYSCALE ON PURPOSE.
     The renderer tints this through mix multiply against a part mask, so every
     shadow and highlight here survives into whatever colour the buyer picks.
     Placeholder art. A real grayscale studio shot drops in at this exact size
     and nothing in the engine changes. -->
<defs>
  <!-- Cylinder falloff. Dark at both edges, specular at 22%, second lift at 62%. -->
  <linearGradient id="cyl" x1="200" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0.00" stop-color="#9a9a9a"/>
    <stop offset="0.05" stop-color="#bcbcbc"/>
    <stop offset="0.13" stop-color="#ededed"/>
    <stop offset="0.22" stop-color="#ffffff"/>
    <stop offset="0.34" stop-color="#f4f4f4"/>
    <stop offset="0.50" stop-color="#dedede"/>
    <stop offset="0.66" stop-color="#e6e6e6"/>
    <stop offset="0.82" stop-color="#cacaca"/>
    <stop offset="0.93" stop-color="#ababab"/>
    <stop offset="1.00" stop-color="#8f8f8f"/>
  </linearGradient>
  <linearGradient id="handleShade" x1="640" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#b4b4b4"/>
    <stop offset="0.45" stop-color="#f0f0f0"/>
    <stop offset="1" stop-color="#9c9c9c"/>
  </linearGradient>
  <!-- Contact shadow under the mug. Sits outside the mask so it never tints. -->
  <radialGradient id="drop" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#000" stop-opacity="0.30"/>
    <stop offset="0.65" stop-color="#000" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rimInner" x1="0" y1="104" x2="0" y2="176" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#3a3a3a"/>
    <stop offset="1" stop-color="#6d6d6d"/>
  </linearGradient>
</defs>

<ellipse cx="430" cy="580" rx="290" ry="40" fill="url(#drop)"/>

<!-- Handle sits behind the body so the join is hidden -->
<path d="M628 232 C 792 232, 806 306, 800 344 C 792 410, 726 452, 628 446"
      fill="none" stroke="#8a8a8a" stroke-width="54" stroke-linecap="round"/>
<path d="M628 232 C 792 232, 806 306, 800 344 C 792 410, 726 452, 628 446"
      fill="none" stroke="url(#handleShade)" stroke-width="44" stroke-linecap="round"/>

<!-- Body -->
<path d="M200 140 L200 553 A220 34 0 0 0 640 553 L640 140 Z" fill="url(#cyl)"/>

<!-- Rim -->
<ellipse cx="420" cy="140" rx="220" ry="36" fill="url(#rimInner)"/>
<ellipse cx="420" cy="143" rx="203" ry="30" fill="#2f2f2f"/>
<path d="M200 140 A220 36 0 0 1 640 140 A220 36 0 0 1 200 140 Z" fill="none"
      stroke="#e6e6e6" stroke-width="5" stroke-opacity="0.85"/>

<!-- Bottom edge darkening, keeps the cylinder from looking like a flat card -->
<path d="M200 553 A220 34 0 0 0 640 553" fill="none" stroke="#3d3d3d" stroke-width="6" stroke-opacity="0.5"/>
</svg>
