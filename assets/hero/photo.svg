<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050">
<!-- The picture the homepage mug wears while it assembles itself. Drawn, not
     photographed, on purpose: a stock photo of strangers on a beach would be
     pretending to be somebody's holiday. This is obviously a picture. -->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2A3E55"/>
    <stop offset="0.42" stop-color="#8C6A7A"/>
    <stop offset="0.72" stop-color="#E39B6B"/>
    <stop offset="1" stop-color="#F6C88A"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#C9885E"/>
    <stop offset="0.35" stop-color="#7A5F6E"/>
    <stop offset="1" stop-color="#33384C"/>
  </linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4A3E45"/>
    <stop offset="1" stop-color="#2A242C"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFE6B8" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#FFE6B8" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1400" height="1050" fill="url(#sky)"/>
<circle cx="880" cy="628" r="230" fill="url(#glow)"/>
<circle cx="880" cy="628" r="74" fill="#FFEAC0"/>

<!-- headland -->
<path d="M0 612 l150 -46 l128 34 l96 -18 l120 30 v22 H0 z" fill="#3B3446" opacity="0.85"/>

<rect y="640" width="1400" height="250" fill="url(#sea)"/>
<g fill="#FFE1B0" opacity="0.5">
  <rect x="846" y="664" width="68" height="6" rx="3"/>
  <rect x="836" y="692" width="88" height="6" rx="3"/>
  <rect x="820" y="722" width="120" height="7" rx="3.5"/>
  <rect x="798" y="756" width="164" height="7" rx="3.5"/>
  <rect x="770" y="794" width="220" height="8" rx="4"/>
  <rect x="736" y="836" width="288" height="8" rx="4"/>
</g>
<g fill="#FFFFFF" opacity="0.16">
  <rect x="120" y="704" width="150" height="5" rx="2.5"/>
  <rect x="1080" y="742" width="190" height="5" rx="2.5"/>
  <rect x="300" y="806" width="230" height="6" rx="3"/>
</g>

<rect y="884" width="1400" height="166" fill="url(#sand)"/>
<ellipse cx="700" cy="890" rx="760" ry="26" fill="#5A4B52" opacity="0.7"/>

<!-- two people, small, backs to us. No faces, so it is nobody in particular -->
<g fill="#241E27">
  <path d="M612 894 c0 -34 6 -66 10 -92 c3 -19 -2 -34 -2 -46 a20 20 0 1 1 40 0 c0 12 -5 27 -2 46 c4 26 10 58 10 92 z"/>
  <path d="M712 894 c0 -30 5 -58 9 -82 c3 -17 -2 -30 -2 -41 a18 18 0 1 1 36 0 c0 11 -5 24 -2 41 c4 24 9 52 9 82 z"/>
  <path d="M660 806 c14 -10 30 -12 44 -6" stroke="#241E27" stroke-width="9" stroke-linecap="round" fill="none"/>
</g>

<!-- palm, off to one side, so the crop always keeps something to look at -->
<g stroke="#241E27" stroke-linecap="round" fill="none">
  <path d="M146 890 c-6 -104 4 -190 22 -256" stroke-width="18"/>
  <path d="M168 636 c-52 -30 -96 -30 -130 -6" stroke-width="14"/>
  <path d="M168 636 c-30 -50 -30 -92 -10 -122" stroke-width="14"/>
  <path d="M168 636 c50 -34 96 -34 132 -12" stroke-width="14"/>
  <path d="M168 636 c34 -46 76 -62 118 -60" stroke-width="14"/>
  <path d="M168 636 c-16 54 -12 96 6 128" stroke-width="14"/>
</g>
</svg>
