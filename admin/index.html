<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gifty</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<link rel="stylesheet" href="../css/tokens.css?v=0.3.4">
<link rel="stylesheet" href="../css/base.css?v=0.3.4">

<style>
  /* The gate. One card on the same field the storefront and the dashboard both
     sit on, so the three screens read as one product. */
  body {
    display: grid;
    place-items: center;
    min-block-size: 100svb;
    padding: var(--space-5);
    background: var(--paper-warm);
    background-image:
      radial-gradient(44rem 32rem at 12% -6%, rgb(20 184 166 / 0.16), transparent 62%),
      radial-gradient(38rem 30rem at 92% 8%, rgb(255 186 122 / 0.16), transparent 60%),
      radial-gradient(46rem 34rem at 78% 96%, rgb(138 178 255 / 0.14), transparent 64%);
    background-attachment: fixed;
  }

  .gate {
    inline-size: min(23rem, 100%);
    padding: var(--space-7);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-xl);
    box-shadow: var(--elev-4), var(--edge);
  }

  /* It arrives rather than appearing. This is the only screen in the project
     with nothing else on it, so the one card gets the one animation. */
  @media (prefers-reduced-motion: no-preference) {
    .gate { animation: gate-in 620ms var(--ease-out) both; }
  }

  @keyframes gate-in {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }

  .gate h1 {
    display: flex;
    align-items: center;
    gap: 1px;
    font-size: var(--text-2xl);
    letter-spacing: -0.03em;
    margin-block-end: var(--space-2);
  }
  .gate h1 span { color: var(--teal-deep); }
  .gate h1::after {
    content: "";
    inline-size: 6px;
    block-size: 6px;
    margin-inline-start: 3px;
    margin-block-start: 0.5em;
    border-radius: var(--radius-full);
    background: var(--teal);
  }

  .gate__sub {
    font-size: var(--text-sm);
    color: var(--ink-soft);
    margin-block-end: var(--space-6);
  }

  .gate label { display: block; font-size: var(--text-sm); font-weight: 600; margin-block-end: var(--space-2); }
  .gate input {
    inline-size: 100%;
    min-block-size: 48px;
    padding-inline: var(--space-4);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--paper);
    font-size: var(--text-base);
    transition: border-color var(--t-instant) var(--ease-out);
  }
  .gate input:hover { border-color: var(--ink-faint); }
  .gate input:focus-visible { border-color: var(--teal-deep); }
  .gate .btn { inline-size: 100%; margin-block-start: var(--space-4); }
  .gate p.msg {
    margin-block-start: var(--space-4);
    font-size: var(--text-sm);
    min-block-size: 1.4em;
    color: var(--signal);      /* 4.53:1 */
  }

  /* A wrong password shakes the card once. It is the whole error message: the
     text underneath says what happened, and this says it landed. */
  .gate.is-wrong { animation: gate-no 420ms var(--ease-in-out) 1; }

  @keyframes gate-no {
    0%, 100% { transform: none; }
    18%      { transform: translateX(-7px); }
    42%      { transform: translateX(6px); }
    68%      { transform: translateX(-3px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .gate.is-wrong { animation: none; }
  }
</style>
</head>
<body>

<form class="gate" id="gate" autocomplete="off">
  <h1>Gift<span>y</span></h1>
  <p class="gate__sub">The shop's own screens. Orders, products, templates and settings.</p>
  <label for="pw">Password</label>
  <input type="password" id="pw" autocomplete="current-password" autofocus>
  <button class="btn btn--primary" type="submit" id="go">Open</button>
  <p class="msg" id="msg" role="status"></p>
</form>

<script defer src="payload.js?v=0.3.4"></script>
<script>
/* The gate. Derives a key from the password, decrypts the dashboard, and hands
   the document over to it. A wrong password fails at the cipher, so there is
   nothing here to compare against and nothing to leak.

   This is not the access control. The access control is the rule on the data
   that names exactly one account. This keeps the shop's screens, its address
   and its number out of a public repository. */
(function () {
  'use strict';

  var form = document.getElementById('gate');
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');

  var bytes = function (b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  };

  form.addEventListener('animationend', function (e) {
    if (e.animationName === 'gate-no') form.classList.remove('is-wrong');
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var payload = window.GIFTY_ADMIN_PAYLOAD;
    if (!payload) { msg.textContent = 'This page did not load fully. Reload it.'; return; }

    var pw = document.getElementById('pw').value;
    if (!pw) return;

    go.disabled = true;
    msg.textContent = 'Opening';

    var enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.kdf.iterations, hash: payload.kdf.hash },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv) }, key, bytes(payload.ct));
      })
      .then(function (plain) {
        var html = new TextDecoder().decode(plain);
        /* The dashboard signs in with the same password, so hand it over in
           memory rather than making anyone type it twice. */
        window.__pw = pw;
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        go.disabled = false;
        msg.textContent = 'That password does not open it.';
        /* The shake is the confirmation that the attempt landed. Removed the
           moment it ends, so a second wrong password shakes it again rather
           than doing nothing. */
        form.classList.remove('is-wrong');
        void form.offsetWidth;
        form.classList.add('is-wrong');
        document.getElementById('pw').select();
      });
  });
})();
</script>
</body>
</html>
